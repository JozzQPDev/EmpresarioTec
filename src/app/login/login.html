<div class="min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-blue-950 px-4 relative overflow-hidden">

  <!-- Elementos decorativos de fondo minimalistas -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-slate-700/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Tarjeta de Login -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 border border-slate-200/80 relative z-10 transition-all">

    <!-- Encabezado con Icono de Seguridad -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
        <i class="fa-solid fa-shield-halved text-base"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-900 tracking-tight">Sistema de Seguridad</h2>
      <p class="text-xs text-slate-400 mt-1">Ingrese sus credenciales para acceder al perímetro</p>
    </div>

    <!-- Formulario (Usando Reactive Forms) -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Campo Correo -->
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-700 mb-1.5">Correo Electrónico</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
            <i class="fa-regular fa-envelope text-xs"></i>
          </span>
          <input
            id="email"
            type="email"
            formControlName="email"
            [disabled]="cargando"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-900 focus:bg-white transition-all disabled:opacity-50"
            placeholder="usuario@empresariotec.com"
          />
        </div>
        <!-- Mensajes de Error (Solo aparecen si el campo fue tocado) -->
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-1 text-[11px] text-rose-500 font-medium">
          <p *ngIf="loginForm.get('email')?.errors?.['required']">El correo es obligatorio.</p>
          <p *ngIf="loginForm.get('email')?.errors?.['email']">Ingrese un correo válido.</p>
        </div>
      </div>

      <!-- Campo Contraseña con Ver/Ocultar -->
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Contraseña</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
            <i class="fa-regular fa-lock text-xs"></i>
          </span>
          <input
            id="password"
            [type]="passwordVisible ? 'text' : 'password'"
            formControlName="password"
            [disabled]="cargando"
            class="w-full pl-10 pr-10 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-900 focus:bg-white transition-all disabled:opacity-50"
            placeholder="••••••••"
          />
          <!-- Botón para alternar visibilidad -->
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer"
            [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Ver contraseña'"
          >
            <i [ngClass]="passwordVisible ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'" class="text-xs"></i>
          </button>
        </div>
        <!-- Mensajes de Error -->
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="mt-1 text-[11px] text-rose-500 font-medium">
          <p *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</p>
          <p *ngIf="loginForm.get('password')?.errors?.['minlength']">Debe tener al menos 4 caracteres.</p>
        </div>
      </div>

      <!-- Alerta de Error del Servidor (Flask / Supabase) -->
      <div *ngIf="errorMensaje" class="p-3.5 bg-rose-50 border border-rose-200/80 text-rose-700 text-xs rounded-xl flex items-center gap-2.5 animate-in fade-in slide-in-from-top-2 duration-200">
        <i class="fa-solid fa-circle-exclamation text-rose-600 text-sm shrink-0"></i>
        <span>{{ errorMensaje }}</span>
      </div>

      <!-- Botón de Enviar (Permite hacer clic para disparar las validaciones visuales si está vacío) -->
      <button
        type="submit"
        [disabled]="cargando"
        class="w-full mt-2 py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed cursor-pointer"
      >
        <i *ngIf="cargando" class="fa-solid fa-circle-notch animate-spin text-xs"></i>
        <span>{{ cargando ? 'Verificando acceso...' : 'Iniciar Sesión' }}</span>
      </button>

    </form>

    <!-- Pie de tarjeta -->
    <div class="mt-6 text-center border-t border-slate-100 pt-4">
      <p class="text-[11px] text-slate-400">EmpresarioTec • Seguridad Perimetral v2.0</p>
    </div>

  </div>
</div>
