<header class="flex items-center px-1 py-4 pt-1 justify-between border-b border-slate-200/80">
  <div>
    <!-- Título dinámico -->
    <h1 class="text-sm font-semibold tracking-tight text-slate-900">
      {{ tituloPagina }}
    </h1>
    <!-- Subtítulo dinámico -->
    <p class="text-xs text-slate-500 mt-0.5">
      {{ subtituloPagina }}
    </p>
  </div>

  <!-- Contenedor derecho: Fecha/Hora + Botón de Cerrar Sesión -->
  <div class="flex items-center gap-5">
    <!-- Fecha y Hora -->
    <div class="flex flex-col items-end">
      <div class="text-xs font-semibold text-slate-800 tracking-wide">
        <!-- Muestra la hora -->
        {{ currentTime | date:'HH:mm:ss' }}
      </div>
      <div class="text-[11px] text-slate-400 capitalize mt-0.5">
        <!-- Muestra la fecha -->
        {{ currentTime | date:'fullDate' }}
      </div>
    </div>

    <!-- Separador vertical sutil -->
    <div class="h-6 w-px bg-slate-200"></div>

    <!-- Botón de Cerrar Sesión Minimalista -->
    <button
      (click)="cerrarSesion()"
      class="flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-all group"
      title="Cerrar Sesión"
    >
      <i class="fa-solid fa-arrow-right-from-bracket text-xs transition-transform group-hover:-translate-x-0.5"></i>
    </button>
  </div>
</header>
